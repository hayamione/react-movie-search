name: Deploy to GitHub Pages

# Trigger the workflow on every push to the default branch and via manual dispatch.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permissions granted to this workflow run via the auto-generated GITHUB_TOKEN:
#   contents: read    - required to check out the repository
#   pages: write      - required to publish the Pages deployment
#   id-token: write   - required to authenticate with GitHub Pages (OIDC)
permissions:
  contents: read
  pages: write
  id-token: write

# Ensure only one Pages deployment runs at a time, and that pending runs for
# out-of-date commits are cancelled in favor of the most recent push.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ------------------------------ Build job ------------------------------
  # Installs dependencies and generates the static site into ./dist.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Fetch the repository so the workflow can build from the pushed code.
        uses: actions/checkout@v4

      - name: Setup Node
        # Provide Node.js. `cache: npm` reuses the CI dependency cache derived
        # from package-lock.json, speeding up the install step.
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Pages
        # Initialize GitHub Pages for this run (configured source = GitHub
        # Actions). It sets the environment this workflow deploys to.
        uses: actions/configure-pages@v5

      - name: Install dependencies
        # Deterministic install from the lockfile (fails if it's out of date).
        run: npm ci

      - name: Build with Vite
        # Produces the deployable static app in ./dist. vite.config.ts already
        # sets base to '/react-movie-search/' to match the Pages site URL.
        run: npm run build

      - name: Upload artifact
        # Bundle ./dist into the unified Pages artifact consumed by
        # actions/deploy-pages and shared between the build and deploy jobs.
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ----------------------------- Deploy job ------------------------------
  # Publishes the artifact produced by the build job to GitHub Pages.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Job-level permissions: uploading the deployment artifact and the
    # OpenID token needed to authenticate the deployment are scoped to this job.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # Official GitHub action that publishes the uploaded artifact.
        uses: actions/deploy-pages@v4