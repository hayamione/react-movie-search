<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting&hellip;</title>
    <!--
      GitHub Pages SPA fallback: any unknown path (e.g. a deep link like
      /react-movie-search/search) is handled by this file. The requested path is
      stashed in sessionStorage and redirected to the app root, where main.tsx
      restores it via history.replaceState so the client-side router can render.
    -->
    <script>
      sessionStorage.setItem('gh:redirect', location.pathname + location.search + location.hash);
      location.replace('/react-movie-search/');
    </script>
  </head>
  <body></body>
</html>
